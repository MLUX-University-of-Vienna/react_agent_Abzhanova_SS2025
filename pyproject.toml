[build-system]
requires = ["setuptools>=68", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "my-react-agent"
version = "1.4.0"
description = "ReAct plan-execute agent with memory"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"

license = { file = "LICENSE" }

authors = [
  { name = "Zhaniya Abzhanova", email = "zhaniya.abzhanova@gmail.com" }
]

dependencies = [
  "ollama>=0.5.0",
  "regex>=2023.0.0",
]

[project.optional-dependencies]
tools = [
  "wikipedia>=1.4.0",
  "Wikipedia-API>=0.8.1",
  "google-search-results>=2.4.2",
  "python-docx>=1.1.0",
  "pdfminer.six>=2023.0.0",
  "beautifulsoup4",
]

vector = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
